<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السنة الجديدة</title>

<!-- خط عربي فاخر -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #3b3b3b, #0e0e0e);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Amiri', serif;
    overflow: hidden;
    color: #d4af37;
}

/* نجوم خلفية */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: silver;
    opacity: .6;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .3; }
    to { opacity: 1; }
}

.container {
    text-align: center;
    padding: 20px;
    animation: float 5s ease-in-out infinite;
}

.tree {
    font-size: 20px;
    line-height: 1.2;
    text-shadow: 0 0 15px gold;
    animation: glow 2.5s infinite alternate;
}

.title {
    font-size: 34px;
    margin-top: 25px;
    letter-spacing: 2px;
}

.subtitle {
    font-size: 20px;
    color: silver;
    margin-top: 10px;
}

/* العداد */
.countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.time {
    background: rgba(255,255,255,0.08);
    border: 1px solid #d4af37;
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 70px;
}

.number {
    font-size: 26px;
    font-weight: bold;
}

.label {
    font-size: 14px;
    color: silver;
}

/* حركات */
@keyframes glow {
    from { text-shadow: 0 0 8px gold; }
    to { text-shadow: 0 0 22px gold; }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* موبايل */
@media (max-width: 600px) {
    .tree { font-size: 18px; }
    .title { font-size: 26px; }
    .number { font-size: 22px; }
}
</style>
</head>

<body>

<!-- نجوم -->
<script>
for(let i=0;i<70;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.top=Math.random()*100+"%";
    s.style.left=Math.random()*100+"%";
    s.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(s);
}
</script>

<div class="container">
    <div class="tree">
        ⭐<br>
        ▲<br>
        ▲▲<br>
        ▲▲▲<br>
        ▲▲▲▲<br>
        ▲▲▲▲▲<br>
        ▲▲▲▲▲▲<br>
        ▮▮
    </div>

    <div class="title">السعيد يهنئكم</div>
    <div class="subtitle">بحلول السنة الجديدة</div>

    <div class="countdown">
        <div class="time">
            <div class="number" id="days">0</div>
            <div class="label">أيام</div>
        </div>
        <div class="time">
            <div class="number" id="hours">0</div>
            <div class="label">ساعات</div>
        </div>
        <div class="time">
            <div class="number" id="minutes">0</div>
            <div class="label">دقائق</div>
        </div>
        <div class="time">
            <div class="number" id="seconds">0</div>
            <div class="label">ثواني</div>
        </div>
    </div>
</div>

<script>
const targetDate = new Date(new Date().getFullYear() + 1, 0, 1);

function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    days.textContent = d;
    hours.textContent = h;
    minutes.textContent = m;
    seconds.textContent = s;
}
setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
